<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maze</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0f0f0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    color: #e0e0e0;
  }

  h1 {
    font-size: 13px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #555;
    margin-bottom: 24px;
  }

  #canvas-wrap {
    border: 1px solid #2a2a2a;
    background: #111;
    padding: 20px;
  }

  canvas { display: block; }

  .controls {
    margin-top: 20px;
    display: flex;
    gap: 12px;
    align-items: center;
  }

  label { font-size: 12px; color: #555; letter-spacing: 0.1em; }

  input[type="number"] {
    width: 52px;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    padding: 5px 8px;
    text-align: center;
    outline: none;
  }
  input[type="number"]:focus { border-color: #555; }

  button {
    background: none;
    border: 1px solid #2a2a2a;
    color: #888;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 6px 16px;
    cursor: pointer;
    transition: all 0.15s;
  }
  button:hover { border-color: #555; color: #e0e0e0; }
  button:active { background: #1a1a1a; }
</style>
</head>
<body>

<h1>Maze Generator</h1>

<div id="canvas-wrap">
  <canvas id="mazeCanvas"></canvas>
</div>

<div class="controls">
  <label>ROWS</label>
  <input type="number" id="inputR" value="12" min="3" max="40">
  <label>COLS</label>
  <input type="number" id="inputC" value="16" min="3" max="60">
  <button onclick="init()">Redraw</button>
</div>

<script>
// =============================================================
//  MAZE DATA STRUCTURE
//  Visible cells: rows 1..R, cols 1..C
//  northWall[i][j] = 1  →  top wall of cell (i,j) is intact
//  eastWall[i][j]  = 1  →  right wall of cell (i,j) is intact
//  Row 0 is the phantom row (forms the bottom boundary)
//  Col 0 is the left-edge column
// =============================================================

let R, C, northWall, eastWall;

function createGrid(rows, cols) {
  return Array.from({ length: rows }, () => new Array(cols).fill(1));
}

function initMaze(r, c) {
  R = r;
  C = c;
  northWall = createGrid(R + 1, C + 1);
  eastWall  = createGrid(R + 1, C + 1);
}

// =============================================================
//  drawGrid(ctx, R, C, cellSize, northWall, eastWall)
//
//  Renders the maze onto a canvas 2D context.
//
//  Coordinate mapping:
//    Cell (row, col) occupies the canvas rect:
//      x = (col - 1) * cellSize
//      y = (R - row) * cellSize     ← row 1 is at the TOP visually
//
//  Wall drawing:
//    northWall[i][j] = 1  →  draw the top horizontal segment of cell (i,j)
//    eastWall[i][j]  = 1  →  draw the right vertical segment of cell (i,j)
//    The outer boundary (top row, right col, phantom row 0, left col 0)
//    is always drawn regardless of wall values.
// =============================================================

function drawGrid(ctx, R, C, cellSize, northWall, eastWall) {
  const W = C * cellSize;   // total canvas width  (pixels)
  const H = R * cellSize;   // total canvas height (pixels)

  ctx.clearRect(0, 0, W, H);

  ctx.strokeStyle = "#e0e0e0";
  ctx.lineWidth   = 1.5;
  ctx.lineCap     = "square";

  // -----------------------------------------------------------------
  // Draw interior horizontal walls (north walls of visible rows 1..R)
  // -----------------------------------------------------------------
  for (let i = 1; i <= R; i++) {         // row
    for (let j = 1; j <= C; j++) {       // col

      if (northWall[i][j] === 1) {
        // top edge of cell (i, j)
        const x = (j - 1) * cellSize;
        const y = (R - i) * cellSize;    // row R → y=0 (top), row 1 → y=(R-1)*cellSize

        ctx.beginPath();
        ctx.moveTo(x,            y);
        ctx.lineTo(x + cellSize, y);
        ctx.stroke();
      }
    }
  }

  // -----------------------------------------------------------------
  // Draw interior vertical walls (east walls of visible cols 1..C)
  // -----------------------------------------------------------------
  for (let i = 1; i <= R; i++) {
    for (let j = 1; j <= C; j++) {

      if (eastWall[i][j] === 1) {
        // right edge of cell (i, j)
        const x = j * cellSize;
        const y = (R - i) * cellSize;

        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x, y + cellSize);
        ctx.stroke();
      }
    }
  }

  // -----------------------------------------------------------------
  // Draw the outer boundary explicitly
  // This ensures the maze border is always complete, even after walls
  // are eaten during generation (the algorithm never eats boundary
  // walls, but drawing them separately is safer and clearer).
  // -----------------------------------------------------------------
  ctx.lineWidth = 2;

  // Top boundary
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(W, 0);
  ctx.stroke();

  // Bottom boundary
  ctx.beginPath();
  ctx.moveTo(0, H);
  ctx.lineTo(W, H);
  ctx.stroke();

  // Left boundary
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, H);
  ctx.stroke();

  // Right boundary
  ctx.beginPath();
  ctx.moveTo(W, 0);
  ctx.lineTo(W, H);
  ctx.stroke();
}

// =============================================================
//  init — wire everything together
// =============================================================
function init() {
  const r = Math.max(3, Math.min(40, parseInt(document.getElementById("inputR").value) || 12));
  const c = Math.max(3, Math.min(60, parseInt(document.getElementById("inputC").value) || 16));

  // Fit the canvas to a fixed max size while keeping cells square
  const maxW = 640;
  const maxH = 480;
  const cellSize = Math.floor(Math.min(maxW / c, maxH / r));

  const canvas = document.getElementById("mazeCanvas");
  canvas.width  = c * cellSize;
  canvas.height = r * cellSize;

  initMaze(r, c);

  const ctx = canvas.getContext("2d");
  drawGrid(ctx, R, C, cellSize, northWall, eastWall);
}

// Run on load
init();
</script>
</body>
</html>
